<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>الحضور الذكي | إدارة حضور الشركات</title><link rel="manifest" href="/manifest.json"><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e6eaf0;--primary:#0f172a;--ok:#16803c;--bad:#b42318;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}header{background:var(--primary);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800}.wrap{max-width:1250px;margin:auto;padding:22px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 5px 25px #10182808}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{font-size:30px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}button{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.ok{background:var(--ok);color:#fff}.bad{background:var(--bad);color:#fff}.blue{background:var(--accent);color:#fff}.soft{background:#eef2f7;color:#172033}input,select{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:10px;margin:6px 0 12px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:11px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button{white-space:nowrap}.hidden{display:none}.login{max-width:460px;margin:70px auto}.hero{text-align:center;padding:30px}.actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);margin:10px 0}@media(max-width:650px){header{padding:13px 15px}.wrap{padding:12px 10px}.card{padding:15px}.hero{padding:22px}th,td{padding:8px;font-size:12px}}
</style></head><body><header><div class="brand">◉ الحضور الذكي</div><div id="who"></div></header><main class="wrap">
<section id="login" class="card login hero"><h1>نظام الحضور والانصراف</h1><p class="muted">منصة إدارة حضور الشركات من الهاتف</p><input id="email" value="admin@example.com" placeholder="البريد الإلكتروني"><input id="pass" value="Admin@123" type="password" placeholder="كلمة المرور"><button class="primary" style="width:100%" onclick="login()">دخول آمن</button><div class="notice">تجريبي: admin@example.com / Admin@123</div></section>
<section id="app" class="hidden"><div id="employeeView" class="hidden"></div><div id="adminView" class="hidden">
<div class="tabs"><button class="primary" onclick="tab('dash')">الرئيسية</button><button class="soft" onclick="tab('employees')">الموظفون</button><button class="soft" onclick="tab('branches')">الفروع</button><button class="soft" onclick="tab('leaves')">الإجازات</button><button class="soft" onclick="tab('audit')">سجل التدقيق</button></div>
<div id="dash" class="tab"><div class="grid"><div class="card"><span class="muted">الموظفون</span><div id="st1" class="stat">0</div></div><div class="card"><span class="muted">الحاضرون</span><div id="st2" class="stat">0</div></div><div class="card"><span class="muted">المتأخرون</span><div id="st3" class="stat">0</div></div><div class="card"><span class="muted">الغياب المتوقع</span><div id="st4" class="stat">0</div></div></div><div class="card"><div class="actions"><button class="blue" onclick="location='/api/export'">تصدير CSV</button><button class="soft" onclick="dashboard()">تحديث</button></div><h3>حضور اليوم</h3><div id="today"></div></div><div class="card"><h3>إعدادات الشركة والموقع</h3><div class="grid"><input id="cn" placeholder="اسم الشركة"><input id="clat" type="number" step="any" placeholder="خط العرض"><input id="clng" type="number" step="any" placeholder="خط الطول"><input id="cr" type="number" placeholder="النطاق بالمتر"></div><button class="primary" onclick="saveCompany()">حفظ</button></div></div>
<div id="employees" class="tab hidden"><div class="card"><h3>إضافة موظف</h3><div class="grid"><input id="en" placeholder="اسم الموظف"><input id="ee" placeholder="البريد الإلكتروني"><input id="ep" placeholder="كلمة المرور"><select id="eb"></select></div><button class="primary" onclick="addEmployee()">إضافة</button></div><div class="card"><h3>الموظفون</h3><div id="elist"></div></div></div>
<div id="branches" class="tab hidden"><div class="card"><h3>إضافة فرع</h3><div class="grid"><input id="bn" placeholder="اسم الفرع"><input id="blat" type="number" step="any" placeholder="خط العرض"><input id="blng" type="number" step="any" placeholder="خط الطول"><input id="br" type="number" value="150" placeholder="النطاق"></div><button class="primary" onclick="addBranch()">إضافة الفرع</button></div><div class="card"><div id="blist"></div></div></div>
<div id="leaves" class="tab hidden"><div class="card"><h3>طلبات الإجازات</h3><div id="llist"></div></div></div><div id="audit" class="tab hidden"><div class="card"><h3>سجل التدقيق</h3><div id="alist"></div></div></div>
</div></section></main><div id="toast" style="position:fixed;bottom:18px;left:15px;right:15px;max-width:520px;margin:auto;background:#111827;color:white;padding:13px;border-radius:12px;text-align:center;display:none"></div>
<script>
let me=null,boot=null;const $=x=>document.getElementById(x);function toast(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",3200)}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pass").value})}),d=await r.json();if(!r.ok)return toast(d.error);me=d.user;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.name;if(me.role==="employee")employee();else admin();await load()}
async function load(){boot=await (await fetch("/api/bootstrap")).json();if(me.role!=="employee"){fillBranches();employees();branches();leaves();audit()}}
function employee(){let e=$("employeeView");e.classList.remove("hidden");e.innerHTML=`<div class="card hero"><h2>مرحبًا ${me.name}</h2><p class="muted">تحقق الموقع والوقت يتمان من الخادم. لا تستخدم VPN أو إعدادات موقع وهمية.</p><div class="actions" style="justify-content:center"><button class="ok" onclick="att('checkin')">تسجيل الحضور</button><button class="bad" onclick="att('checkout')">تسجيل الانصراف</button><button class="soft" onclick="myRecords()">تحديث</button></div></div><div class="card"><h3>سجل عملي</h3><div id="my"></div></div>`;myRecords()}
async function att(type){if(!navigator.geolocation)return toast("الهاتف لا يدعم تحديد الموقع");toast("جارٍ التحقق من الموقع...");navigator.geolocation.getCurrentPosition(async p=>{let device=localStorage.smartDevice||(localStorage.smartDevice=crypto.randomUUID()),r=await fetch("/api/attendance",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:me.id,type,lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,deviceId:device,branchId:me.branchId})}),d=await r.json();if(!r.ok)return toast(d.error);toast("تمت العملية بنجاح");myRecords()},e=>toast("تعذر الحصول على الموقع: "+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function myRecords(){let d=await(await fetch("/api/employee/"+me.id)).json();$("my").innerHTML=d.rows.length?`<table><tr><th>التاريخ</th><th>العملية</th><th>الوقت</th><th>الدقة</th><th>المسافة</th></tr>${d.rows.map(x=>`<tr><td>${x.date}</td><td>${x.type==="checkin"?"حضور":"انصراف"}</td><td>${x.time}</td><td>${x.accuracy}م</td><td>${x.distanceMeters}م</td></tr>`).join("")}</table>`:"لا توجد سجلات"}
function admin(){$("adminView").classList.remove("hidden");tab("dash")}
async function dashboard(){let d=await(await fetch("/api/dashboard")).json();$("st1").textContent=d.stats.employees;$("st2").textContent=d.stats.present;$("st3").textContent=d.stats.late;$("st4").textContent=d.stats.absent;$("cn").value=d.company.name;$("clat").value=d.company.lat;$("clng").value=d.company.lng;$("cr").value=d.company.radius;$("today").innerHTML=`<table><tr><th>الموظف</th><th>العملية</th><th>الوقت</th><th>GPS</th><th>تأخير</th></tr>${d.rows.map(x=>`<tr><td>${d.employees.find(u=>u.id===x.userId)?.name||"-"}</td><td>${x.type==="checkin"?"حضور":"انصراف"}</td><td>${x.time}</td><td>${x.distanceMeters}م / دقة ${x.accuracy}م</td><td>${x.late?"نعم":"لا"}</td></tr>`).join("")}</table>`}
async function admin(){ $("adminView").classList.remove("hidden"); await dashboard() }
function tab(n){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));$(n).classList.remove("hidden");if(n==="dash")dashboard();if(n==="employees")employees();if(n==="branches")branches();if(n==="leaves")leaves();if(n==="audit")audit()}
function fillBranches(){$("eb").innerHTML=boot.branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join("")}
function employees(){$("elist").innerHTML=`<table><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>الجهاز</th><th>الحالة</th></tr>${boot.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.deviceId?"مرتبط":"غير مرتبط"}</td><td><span class="tag">${u.active?"نشط":"متوقف"}</span></td></tr>`).join("")}</table>`}
async function addEmployee(){let r=await fetch("/api/employee",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("en").value,email:$("ee").value,password:$("ep").value,branchId:$("eb").value})}),d=await r.json();if(!r.ok)return toast(d.error);toast("تمت إضافة الموظف");await load()}
function branches(){$("blist").innerHTML=`<table><tr><th>الفرع</th><th>النطاق</th><th>الإحداثيات</th></tr>${boot.branches.map(b=>`<tr><td>${b.name}</td><td>${b.radius}م</td><td>${b.lat}, ${b.lng}</td></tr>`).join("")}</table>`}
async function addBranch(){let body={name:$("bn").value,lat:+$("blat").value,lng:+$("blng").value,radius:+$("br").value},r=await fetch("/api/branch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return toast(d.error);toast("تمت إضافة الفرع");await load()}
async function saveCompany(){let body={name:$("cn").value,lat:+$("clat").value,lng:+$("clng").value,radius:+$("cr").value},r=await fetch("/api/company",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return toast(d.error);toast("تم الحفظ");await load()}
function leaves(){ $("llist").innerHTML=boot.leaves.length?`<table><tr><th>الموظف</th><th>الفترة</th><th>النوع</th><th>الحالة</th></tr>${boot.leaves.map(l=>`<tr><td>${boot.users.find(u=>u.id===l.userId)?.name||"-"}</td><td>${l.from} → ${l.to}</td><td>${l.type}</td><td>${l.status}</td></tr>`).join("")}</table>`:"لا توجد طلبات"}
async function audit(){let d=await(await fetch("/api/audit")).json();$("alist").innerHTML=`<table><tr><th>الوقت</th><th>العملية</th><th>المستخدم</th></tr>${d.map(a=>`<tr><td>${new Date(a.at).toLocaleString("ar-SA")}</td><td>${a.action}</td><td>${boot.users.find(u=>u.id===a.userId)?.name||a.userId}</td></tr>`).join("")}</table>`}
</script></body></html>
